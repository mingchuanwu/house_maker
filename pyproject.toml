[project]
name = "house-maker"
dynamic = ["version"]          # from the latest git tag (setuptools-scm), e.g. v1.0.0
description = "Laser-cut house box generator: finger-jointed panels with windows, doors, chimneys and dormers, as cut-ready SVG"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# The library uses only the Python standard library.
dependencies = []

[project.scripts]
house-maker = "house_maker.generate_house:main"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.apple.com/simple"
default = true

# The repository root *is* the `house_maker` package.
[tool.setuptools]
package-dir = { "house_maker" = "." }
packages = ["house_maker", "house_maker.builders", "house_maker.review"]    # warnings_util etc. are top-level modules of house_maker

[tool.setuptools.package-data]
"house_maker.review" = ["viewer.html", "viewer.css", "viewer_core.js", "viewer_app.js"]

[tool.setuptools_scm]
# the repository root is the git root and the package root

[tool.uv]
default-groups = ["dev"]
