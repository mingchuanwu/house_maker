<!doctype html>
<meta charset="utf-8">
<title>/*__TITLE__*/ - 3D view</title>
<style>/*__CSS__*/</style>
<header>
  <b>/*__TITLE__*/</b>
  <span class="grp" title="Views: 1 front · 3 right · 7 top (Ctrl: opposite side) · 0 iso · 5 perspective/orthographic · F frame">
    <button data-view="front">Front</button><button data-view="back">Back</button>
    <button data-view="left">Left</button><button data-view="right">Right</button>
    <button data-view="top">Top</button><button data-view="bottom">Bottom</button>
    <button data-view="iso">Iso</button>
    <button id="proj" title="5">Persp</button>
    <button id="fit" title="F: frame the selection (or everything)">Frame</button>
  </span>
  <span class="grp">
    <label title="X"><input type="checkbox" id="xray"> X-ray</label>
    <input type="range" id="opacity" min="0.05" max="0.9" step="0.05" value="0.3" title="X-ray opacity">
    <label><input type="checkbox" id="edges" checked> Edges</label>
    <label><input type="checkbox" id="wire"> Wire</label>
    <label><input type="checkbox" id="material"> Material colours</label>
  </span>
  <span class="grp">
    <label for="explode">Explode</label>
    <input type="range" id="explode" min="0" max="20" step="0.5" value="0">
    <output id="explodeVal">0 mm</output>
  </span>
  <span class="grp">
    <label><input type="checkbox" id="section"> Section</label>
    <select id="axis"><option value="0">X</option><option value="1">Y</option><option value="2" selected>Z</option></select>
    <input type="range" id="sectionPos" min="0" max="1" step="0.1" value="0.5">
    <output id="sectionVal"></output>
    <label><input type="checkbox" id="flip"> Flip</label>
  </span>
  <span class="sp"></span>
  <label title="How a scroll (two-finger swipe / mouse wheel) is read">Scroll
    <select id="wheel"><option value="auto">auto</option><option value="trackpad">trackpad: orbit</option><option value="mouse">mouse: zoom</option></select>
  </label>
</header>
<aside id="outliner"></aside>
<main>
  <canvas id="gl"></canvas>
  <div id="msg" hidden></div>
  <div id="help">Trackpad: swipe to orbit · Shift+swipe to pan · pinch to zoom.
    Mouse: drag to orbit · right/Shift-drag to pan · wheel to zoom.
    Click: select · double-click: orbit around that point · H hide · Alt+H show all · Esc deselect</div>
</main>
<footer><span id="selinfo">Nothing selected</span><span id="cursor"></span></footer>
<script id="model-data" type="application/json">/*__DATA__*/</script>
<script>/*__CORE__*/</script>
<script>/*__APP__*/</script>
