<!doctype html>
<meta charset="utf-8">
<title>Arched cottage - 3D view</title>
<style>* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: grid; grid-template: "head head" auto "side main" 1fr "foot foot" auto / 240px 1fr;
  font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #ddd; background: #2b2b2b;
}
header { grid-area: head; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 6px 10px;
         background: #1f1f1f; border-bottom: 1px solid #111; }
header .grp { display: inline-flex; align-items: center; gap: 4px; }
header .sp { flex: 1; }
header input[type=range] { width: 90px; }
button, select { font: inherit; color: #ddd; background: #3a3a3a; border: 1px solid #555; border-radius: 3px; padding: 2px 7px; cursor: pointer; }
button:hover, select:hover { background: #4a4a4a; }
button.on { background: #4772b3; border-color: #5a86c8; }
output { min-width: 44px; color: #aaa; font-variant-numeric: tabular-nums; }
label { cursor: pointer; user-select: none; }

aside { grid-area: side; overflow: auto; background: #252525; border-right: 1px solid #111; padding: 6px 0; }
.group { margin-bottom: 4px; }
.row { display: flex; align-items: center; gap: 4px; padding: 2px 8px; white-space: nowrap; cursor: pointer; }
.row:hover { background: #333; }
.row.head { font-weight: 600; color: #bbb; text-transform: capitalize; }
.row.part { padding-left: 18px; }
.row.sel { background: #4772b3; color: #fff; }
.row.off .name { opacity: 0.4; }
.row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.row .sw { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.row .eye, .row .solo { width: 22px; padding: 0; border: none; background: none; opacity: 0.75; }
.row .eye:hover, .row .solo:hover { opacity: 1; background: #444; }
.row .solo.on { color: #ffb347; opacity: 1; }

main { grid-area: main; position: relative; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #f88; }
#msg[hidden] { display: none; }            /* the display above would override [hidden] and cover the canvas */
#help { position: absolute; left: 8px; bottom: 6px; color: #888; font-size: 11px; pointer-events: none; }

footer { grid-area: foot; display: flex; justify-content: space-between; padding: 3px 10px; background: #1f1f1f;
         border-top: 1px solid #111; color: #aaa; font-variant-numeric: tabular-nums; }
</style>
<header>
  <b>Arched cottage</b>
  <span class="grp" title="Views: 1 front · 3 right · 7 top (Ctrl: opposite side) · 0 iso · 5 perspective/orthographic · F frame">
    <button data-view="front">Front</button><button data-view="back">Back</button>
    <button data-view="left">Left</button><button data-view="right">Right</button>
    <button data-view="top">Top</button><button data-view="bottom">Bottom</button>
    <button data-view="iso">Iso</button>
    <button id="proj" title="5">Persp</button>
    <button id="fit" title="F: frame the selection (or everything)">Frame</button>
  </span>
  <span class="grp">
    <label title="X"><input type="checkbox" id="xray"> X-ray</label>
    <input type="range" id="opacity" min="0.05" max="0.9" step="0.05" value="0.3" title="X-ray opacity">
    <label><input type="checkbox" id="edges" checked> Edges</label>
    <label><input type="checkbox" id="wire"> Wire</label>
    <label><input type="checkbox" id="material"> Material colours</label>
  </span>
  <span class="grp">
    <label for="explode">Explode</label>
    <input type="range" id="explode" min="0" max="20" step="0.5" value="0">
    <output id="explodeVal">0 mm</output>
  </span>
  <span class="grp">
    <label><input type="checkbox" id="section"> Section</label>
    <select id="axis"><option value="0">X</option><option value="1">Y</option><option value="2" selected>Z</option></select>
    <input type="range" id="sectionPos" min="0" max="1" step="0.1" value="0.5">
    <output id="sectionVal"></output>
    <label><input type="checkbox" id="flip"> Flip</label>
  </span>
  <span class="sp"></span>
  <label title="How a scroll (two-finger swipe / mouse wheel) is read">Scroll
    <select id="wheel"><option value="auto">auto</option><option value="trackpad">trackpad: orbit</option><option value="mouse">mouse: zoom</option></select>
  </label>
</header>
<aside id="outliner"></aside>
<main>
  <canvas id="gl"></canvas>
  <div id="msg" hidden></div>
  <div id="help">Trackpad: swipe to orbit · Shift+swipe to pan · pinch to zoom.
    Mouse: drag to orbit · right/Shift-drag to pan · wheel to zoom.
    Click: select · double-click: orbit around that point · H hide · Alt+H show all · Esc deselect</div>
</main>

<script>/* The 3D viewer page: WebGL drawing, input, outliner and toolbar. All maths lives in viewer_core.js (V3). */

    hidden: new Set(), solo: null, selected: null, explode: 0,
    xray: false, opacity: 0.3, edges: true, wire: false, material: false,

  const offset = (p) => V.explodeOffset(p, state.explode);

  const keep = (pt) => !state.section.on || V.keeps(plane(), pt);

  const cam = V.camera();

  // ------------------------------------------------------------------ WebGL

  if (!parts.length) message('No parts in this model');
  else if (!gl) message('WebGL is not available in this browser');

  const MESH_VS = `attribute vec3 aPos; attribute vec3 aNor; uniform mat4 uMVP; uniform vec3 uOff;
    varying vec3 vWorld; varying vec3 vNor;
    void main() { vec3 w = aPos + uOff; vWorld = w; vNor = aNor; gl_Position = uMVP * vec4(w, 1.0); }`;
  const MESH_FS = `precision highp float;
    uniform vec3 uColor; uniform float uAlpha; uniform vec4 uPlane; uniform float uClip; uniform vec3 uLight; uniform vec3 uCap;
    varying vec3 vWorld; varying vec3 vNor;
    void main() {

      row.classList.toggle('off', !visible(p));
      row.querySelector('.eye').textContent = state.hidden.has(p.name) ? '–' : '👁';
      row.querySelector('.solo').classList.toggle('on', state.solo === p.name);
      row.querySelector('.sw').style.background = css(state.material ? p.material : p.distinct);
    }
    for (const head of outliner.querySelectorAll('.row.head')) {
      const members = parts.filter((p) => p.group === head.dataset.group);
      head.querySelector('.eye').textContent = members.every((p) => state.hidden.has(p.name)) ? '–' : '👁';
    }
  }
  updateOutliner();

  // ------------------------------------------------------------------ toolbar
  const setProj = (ortho) => { cam.ortho = ortho; $('#proj').textContent = ortho ? 'Ortho' : 'Persp'; redraw(); };
  const view = (name) => { V.setView(cam, name); redraw(); };
  document.querySelectorAll('[data-view]').forEach((b) => { b.onclick = () => view(b.dataset.view); });
  $('#proj').onclick = () => setProj(!cam.ortho);
  $('#fit').onclick = frameView;
  const bind = (id, fn, ev = 'input') => $(id).addEventListener(ev, (e) => { fn(e.target); redraw(); });
  bind('#xray', (el) => { state.xray = el.checked; }, 'change');
  bind('#opacity', (el) => { state.opacity = +el.value; });
  bind('#edges', (el) => { state.edges = el.checked; }, 'change');
  bind('#wire', (el) => { state.wire = el.checked; }, 'change');
  bind('#material', (el) => { state.material = el.checked; updateOutliner(); }, 'change');
  bind('#explode', (el) => { state.explode = +el.value; $('#explodeVal').textContent = `${el.value} mm`; });
  const sectionRange = () => {
    const a = state.section.axis, lo = model.min[a] - 1, hi = model.max[a] + 1, el = $('#sectionPos');
    el.min = lo.toFixed(1); el.max = hi.toFixed(1);
    if (state.section.pos < lo || state.section.pos > hi) state.section.pos = model.centre[a];
    el.value = state.section.pos;
    $('#sectionVal').textContent = `${'XYZ'[a]} ${state.section.pos.toFixed(1)}`;
  };
  state.section.pos = model.centre[2];
  sectionRange();
  bind('#section', (el) => { state.section.on = el.checked; }, 'change');
  bind('#axis', (el) => { state.section.axis = +el.value; state.section.pos = model.centre[state.section.axis]; sectionRange(); }, 'change');
  bind('#sectionPos', (el) => { state.section.pos = +el.value; sectionRange(); });
  bind('#flip', (el) => { state.section.flip = el.checked; }, 'change');
  $('#wheel').value = state.wheel;
  bind('#wheel', (el) => { state.wheel = el.value; store('viewer3d.wheel', el.value); }, 'change');

  // ------------------------------------------------------------------ pointer and wheel
  let drag = null;
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, button: e.button, moved: false };
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
      drag.moved = true; drag.x = e.clientX; drag.y = e.clientY;
      if (drag.button === 2 || e.shiftKey) V.pan(cam, dx, dy, canvas.clientHeight || 1);
      else V.orbit(cam, dx, dy);
      redraw();
    } else hover(e);
  });
  canvas.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved && drag.button === 0) {
      const hit = pickAt(e.clientX, e.clientY);
      select(hit ? hit.part.name : null);
    }
    drag = null;
  });
  canvas.addEventListener('dblclick', (e) => {
    const hit = pickAt(e.clientX, e.clientY);
    if (hit) { V.pivotAbout(cam, hit.point); redraw(); }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    const dx = e.deltaX * unit, dy = e.deltaY * unit;
    const action = V.wheelAction(e, state.wheel);
    if (action === 'orbit') V.orbit(cam, -dx, -dy);
    else if (action === 'pan') V.pan(cam, -dx, -dy, canvas.clientHeight || 1);
    else {
      const f = Math.exp(dy * (action === 'pinch' ? 0.01 : 0.0015));
      V.zoomAbout(cam, Math.max(0.2, Math.min(5, f)), V.focalPoint(cam, rayAt(e.clientX, e.clientY)));
    }
    redraw();
  }, { passive: false });
  let hoverQueued = null;
  function hover(e) {
    if (hoverQueued) { hoverQueued = e; return; }
    hoverQueued = e;
    requestAnimationFrame(() => {
      const ev = hoverQueued; hoverQueued = null;
      const hit = pickAt(ev.clientX, ev.clientY);
      $('#cursor').textContent = hit ? `${hit.part.name}  x ${fmt(hit.point[0])}  y ${fmt(hit.point[1])}  z ${fmt(hit.point[2])} mm` : '';
    });
  }

  // ------------------------------------------------------------------ keys
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || (e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'range')) return;
    const c = e.code.replace('Numpad', 'Digit'), opposite = e.ctrlKey || e.metaKey;
    const views = { Digit1: ['front', 'back'], Digit3: ['right', 'left'], Digit7: ['top', 'bottom'] };
    if (views[c]) { view(views[c][opposite ? 1 : 0]); e.preventDefault(); }
    else if (c === 'Digit0') view('iso');
    else if (c === 'Digit5') setProj(!cam.ortho);
    else if (c === 'KeyF') frameView();
    else if (c === 'KeyH' && e.altKey) showAll();
    else if (c === 'KeyH' && state.selected) { state.hidden.add(state.selected); select(null); }
    else if (c === 'KeyX') { $('#xray').checked = !$('#xray').checked; state.xray = $('#xray').checked; redraw(); }
    else if (c === 'Escape') select(null);
  });

  window.addEventListener('resize', redraw);
  redraw();
  window.__viewer = { state, parts, cam, select, toggleHidden, setSolo, toggleGroup, showAll, frameView, visible };
})();
</script>
